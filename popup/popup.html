<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <label class="row"><span>Enable Cinematic</span><span class="switch"><input type="checkbox" data-key="enabled"><span></span></span></label>
  <label class="row sub"><span>Previews with sound</span><span class="switch"><input type="checkbox" data-key="sound"><span></span></span></label>
  <label class="row sub"><span>Ambient light on videos</span><span class="switch"><input type="checkbox" data-key="ambient"><span></span></span></label>
  <label class="row sub col"><span>Glow strength</span><input type="range" min="0.3" max="1" step="0.05" data-key="ambientStrength"></label>
  <label class="row sub"><span>Hide Shorts everywhere</span><span class="switch"><input type="checkbox" data-key="hideShorts"><span></span></span></label>
  <button id="open"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="5" width="20" height="14" rx="4" fill="#fff"/><path d="M10 9v6l5-3z" fill="#e00"/></svg>Open YouTube</button>
  <script src="popup.js"></script>
</body>
</html>
