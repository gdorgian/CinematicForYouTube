<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <label class="row master"><span>Enable Cinematic</span><span class="switch"><input type="checkbox" data-key="enabled"><span></span></span></label>

  <section data-needs="netflixHome">
    <label class="row head"><span>Netflix mode <small>Home screen</small></span><span class="switch"><input type="checkbox" data-key="netflixHome"><span></span></span></label>
    <label class="row sub"><span>Previews with sound</span><span class="switch"><input type="checkbox" data-key="sound"><span></span></span></label>
  </section>

  <section data-needs="immersiveTheater">
    <label class="row head"><span>Theater mode <small>new video layout</small></span><span class="switch"><input type="checkbox" data-key="immersiveTheater"><span></span></span></label>
    <label class="row sub col"><span>Video size</span><input type="range" min="70" max="100" step="1" data-key="theaterSize"></label>
  </section>

  <section data-needs="ambient">
    <label class="row head"><span>Ambient light <small>glow around videos</small></span><span class="switch"><input type="checkbox" data-key="ambient"><span></span></span></label>
    <label class="row sub"><span>Only in theater mode</span><span class="switch"><input type="checkbox" data-key="ambientTheaterOnly"><span></span></span></label>
    <label class="row sub"><span>Remove black bars</span><span class="switch"><input type="checkbox" data-key="ambientBars"><span></span></span></label>
    <label class="row sub col"><span>Spread</span><input type="range" min="15" max="300" step="1" data-key="ambientSpread"></label>
    <label class="row sub col"><span>Blur</span><input type="range" min="0" max="100" step="1" data-key="ambientBlur"></label>
    <label class="row sub col"><span>Strength</span><input type="range" min="0.3" max="1" step="0.05" data-key="ambientStrength"></label>
  </section>

  <section>
    <label class="row sub"><span>Hide Shorts everywhere</span><span class="switch"><input type="checkbox" data-key="hideShorts"><span></span></span></label>
  </section>

  <button id="open"><svg viewBox="0 0 24 24" width="20" height="20"><rect x="2" y="5" width="20" height="14" rx="4" fill="#fff"/><path d="M10 9v6l5-3z" fill="#e00"/></svg>Open YouTube</button>
  <script src="popup.js"></script>
</body>
</html>
