<!doctype html>
<!-- Local test bench for ambient.js: a fake YouTube watch page whose "video" is a
     generated test pattern. Left 15% red, right 15% blue, middle green with a moving
     white square. A correct glow is red on the left, blue on the right and has no
     green in the margins (the light comes from the picture's edges).
     ?bars=1 adds letterbox bars (like a widescreen film): with "Remove black bars"
     on, the glow above and below must still be green, not black.
     Serve the repo root (see .claude/launch.json) and open /test/ambient.html. -->
<html dark>
<head>
  <meta charset="utf-8">
  <title>Ambient test</title>
  <link rel="stylesheet" href="../cinematic.css">
  <style>
    body { margin: 0; font: 15px Roboto, Arial, sans-serif; color: #f1f1f1; }
    ytd-app { display: block; background: #0f0f0f; min-height: 100vh; }
    ytd-watch-flexy { display: block; padding: 80px 0 0 140px; }
    #movie_player { width: 960px; height: 540px; position: relative; }
    #movie_player video { width: 100%; height: 100%; display: block; }
    #below { width: 960px; padding-top: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
  </style>
</head>
<body>
  <ytd-app>
    <ytd-watch-flexy>
      <div id="movie_player"><video class="html5-main-video" muted playsinline></video></div>
      <div id="below">
        <h1>Test pattern: red left edge, blue right edge, green middle</h1>
        <p>Text over the glow should stay readable.</p>
      </div>
    </ytd-watch-flexy>
  </ytd-app>
  <script>
    history.replaceState({}, '', '/watch' + location.search); // ambient.js only runs on /watch
    // ?barsoff = the popup's "Remove black bars" switched off
    const barsOff = new URLSearchParams(location.search).has('barsoff');
    window.chrome = { storage: { sync: { get: (d, cb) => cb({ ...d, ...(barsOff ? { ambientBars: false } : {}) }), set() {} }, onChanged: { addListener() {} } } };
    const c = document.createElement('canvas');
    c.width = 640; c.height = 360;
    const g = c.getContext('2d');
    let x = 120;
    const bars = new URLSearchParams(location.search).has('bars');
    (function paint() {
      g.fillStyle = '#1db954'; g.fillRect(0, 0, 640, 360);
      g.fillStyle = '#ff2020'; g.fillRect(0, 0, 96, 360);
      g.fillStyle = '#2060ff'; g.fillRect(544, 0, 96, 360);
      g.fillStyle = '#fff'; g.fillRect(x, 150, 60, 60);
      if (bars) { g.fillStyle = '#000'; g.fillRect(0, 0, 640, 52); g.fillRect(0, 308, 640, 52); }
      x = x > 460 ? 120 : x + 2;
      requestAnimationFrame(paint);
    })();
    const v = document.querySelector('video');
    v.srcObject = c.captureStream(30);
    v.play();
  </script>
  <script src="../ambient.js"></script>
</body>
</html>
